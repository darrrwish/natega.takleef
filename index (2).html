<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نتيجة تكليفي — خريجي كليات التمريض 2024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#F4F8F7;
      --surface:#FFFFFF;
      --surface-2:#F0F5F4;
      --border:#DCE6E3;
      --primary:#0D9488;
      --primary-dark:#0F766E;
      --primary-dim:rgba(13,148,136,.10);
      --secondary:#D97706;
      --accent-blue:#2563EB;
      --accent-purple:#7C3AED;
      --accent-red:#DC2626;
      --accent-green:#16A34A;
      --accent-orange:#EA580C;
      --accent-yellow:#CA8A04;
      --text:#0F1E1C;
      --muted:#5B6E6A;
      --radius:16px;
      --shadow:0 1px 2px rgba(15,30,28,.04), 0 6px 20px rgba(15,30,28,.05);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{scroll-behavior:smooth;}
    html,body{background:var(--bg);}
    body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;-webkit-font-smoothing:antialiased;}
    #app{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}
    main{animation:none;}
    main.page-fade{animation:pageFade .28s ease;}
    @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
    svg.icon{width:20px;height:20px;flex-shrink:0;vertical-align:middle;outline:none!important;}
    svg.icon-lg{width:28px;height:28px;flex-shrink:0;vertical-align:middle;outline:none!important;}
    svg.icon-sm{width:16px;height:16px;flex-shrink:0;vertical-align:middle;outline:none!important;}
    *:focus{outline:none!important;}
    *:focus-visible{outline:2px solid var(--primary)!important;outline-offset:2px;}
    svg:focus,svg:focus-visible{outline:none!important;}
    header.topbar{background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
    .btn:focus,.btn:focus-visible{outline:none!important;box-shadow:none!important;}
    .bottom-nav a:focus,.bottom-nav a:focus-visible{outline:none!important;box-shadow:none!important;}
    .icon-wrap{position:relative;display:inline-flex;}
    .notif-badge{position:absolute;top:-6px;right:-8px;background:var(--accent-red,#DC2626);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
    .mobile-notif-btn{position:relative;}
    .mobile-notif-btn .notif-badge{top:2px;right:2px;}
    .topbar-inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--primary-dark);cursor:pointer;letter-spacing:.2px;}
    .logo .lg-dot{color:var(--secondary);}
    .avatar-badge{width:56px;height:56px;border-radius:14px;border:1.5px solid var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary);background:var(--primary-dim);margin:0 auto 14px;}
    .nav-actions{display:flex;gap:8px;align-items:center;}
    .nav-links{display:flex;gap:4px;}
    .nav-links a{padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:700;border:1px solid transparent;display:flex;align-items:center;gap:6px;}
    .nav-links a.active{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-dim);}
    .btn{border:1.5px solid var(--primary);border-radius:12px;padding:9px 18px;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .15s, border-color .15s;display:inline-flex;align-items:center;gap:7px;background:var(--surface);color:var(--primary-dark);text-decoration:none;}
    .btn:active{transform:scale(.97);}
    .btn-primary{border-color:var(--primary);background:var(--primary);color:#fff;}
    .btn-secondary{border-color:var(--secondary);color:var(--secondary);background:var(--surface);}
    .btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);}
    .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px;}
    .btn-danger{background:var(--surface);color:var(--accent-red);border-color:var(--accent-red);}
    .btn-block{width:100%;justify-content:center;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:box-shadow .2s ease;}
    .card.accent-teal{border-color:rgba(13,148,136,.35);}
    .card.accent-amber{border-color:rgba(217,119,6,.35);}
    main{flex:1;max-width:1180px;margin:0 auto;padding:0 16px 60px;width:100%;}
    main.with-padding{padding-top:8px;}
    .page-title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;color:var(--primary-dark);margin-bottom:4px;}
    .page-sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.7;}
    .empty-state{border:1.5px dashed var(--border);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);font-size:13.5px;background:var(--surface-2);}
    .hero{text-align:center;padding:12px 16px 30px;background:radial-gradient(60% 100% at 50% 0%, rgba(13,148,136,.08), transparent 70%);}
    .hero .kicker{display:inline-flex;align-items:center;gap:7px;color:var(--primary-dark);background:var(--primary-dim);border:1px solid rgba(13,148,136,.3);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:16px;}
    .hero h1{font-size:clamp(24px,4vw,34px);font-weight:800;margin:0 0 10px;color:var(--text);}
    .hero h1 .hl{color:var(--primary);}
    .hero p{color:var(--muted);margin-bottom:26px;font-size:15px;max-width:620px;margin-left:auto;margin-right:auto;}
    .search-box{max-width:600px;margin:0 auto;display:flex;gap:8px;background:var(--surface);padding:8px;border-radius:16px;border:1.5px solid var(--primary);box-shadow:var(--shadow);}
    .search-box input{flex:1;border:none;outline:none;padding:10px 14px;font-family:'Cairo',sans-serif;font-size:15px;background:transparent;color:var(--text);}
    .search-box input::placeholder{color:var(--muted);}
    .hint-list{max-width:600px;margin:22px auto 0;text-align:right;color:var(--muted);font-size:13px;line-height:2;list-style:none;padding:0;}
    .hint-list li{margin-bottom:2px;display:flex;gap:8px;align-items:flex-start;}
    .hint-list li svg{margin-top:3px;color:var(--primary);}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:36px;}
    .stat{border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;background:var(--surface);box-shadow:var(--shadow);}
    .stat b{display:block;font-size:23px;color:var(--primary-dark);}
    .stat span{font-size:12px;color:var(--muted);}
    .home-actions{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap;}
    .tg-waiting{background:var(--surface-2);border:1.5px solid var(--border);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;}
    .tg-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .home-highlights{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:600px;margin:22px auto 0;}
    .highlight-card{background:var(--surface);border:1.5px solid var(--primary);border-radius:16px;padding:18px 16px;text-align:center;cursor:pointer;transition:box-shadow .2s,transform .15s;box-shadow:var(--shadow);}
    .highlight-card:active{transform:scale(.97);}
    .hl-label{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:8px;}
    .hl-value{font-size:15px;font-weight:800;color:var(--primary-dark);line-height:1.4;margin-bottom:6px;}
    .hl-count{font-size:12.5px;color:var(--primary);font-weight:700;background:var(--primary-dim);border-radius:999px;display:inline-block;padding:2px 12px;}
    .dist-wrap{max-width:760px;margin:34px auto 0;text-align:right;}
    .dist-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px;}
    .dist-label{width:64px;flex-shrink:0;color:var(--muted);font-weight:700;}
    .dist-bar-bg{flex:1;background:var(--surface-2);border-radius:8px;overflow:hidden;height:16px;border:1px solid var(--border);}
    .dist-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:8px;}
    .dist-count{width:64px;flex-shrink:0;text-align:left;color:var(--text);font-weight:700;}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1.3px solid;background:var(--surface);}
    .badge-blue{border-color:var(--accent-blue);color:var(--accent-blue);}
    .badge-green{border-color:var(--accent-green);color:var(--accent-green);}
    .badge-red{border-color:var(--accent-red);color:var(--accent-red);}
    .badge-gray{border-color:var(--muted);color:var(--muted);}
    .badge-orange{border-color:var(--accent-orange);color:var(--accent-orange);}
    .badge-purple{border-color:var(--accent-purple);color:var(--accent-purple);}
    .badge-teal{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-dim);}
    .badge-warning{border-color:var(--accent-yellow);color:var(--accent-yellow);}
    .badge-secondary{border-color:var(--secondary);color:var(--secondary);}
    .result-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;}
    @media(max-width:850px){.result-grid{grid-template-columns:1fr;}}
    dl.result-dl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 0;}
    .result-dl .pair-row{display:flex;gap:16px;}
    .result-dl .pair-row>div{flex:1;min-width:0;}
    dl.result-dl div.full{grid-column:1/-1;}
    dl.result-dl dt{font-size:12px;color:var(--muted);margin-bottom:2px;}
    dl.result-dl dd{margin:0;font-weight:700;font-size:15px;color:var(--text);}
    .rank-hero{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);margin-top:14px;}
    .rank-hero .num{font-size:34px;font-weight:800;color:var(--primary-dark);min-width:60px;text-align:center;}
    .rank-hero .label{font-size:13px;color:var(--muted);}
    .rank-hero .desc{font-size:13.5px;font-weight:700;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text);}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;background:var(--surface);color:var(--text);}
    .form-group input::placeholder,.form-group textarea::placeholder{color:var(--muted);}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);}
    .form-group select option{background:var(--surface);color:var(--text);}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:600px){.form-row{grid-template-columns:1fr;}}
    .list-card{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
    .list-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
    .list-card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;margin-top:12px;font-size:13px;}
    .list-card-grid span.k{color:var(--muted);display:block;font-size:11px;}
    .filters-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
    .filters-bar select,.filters-bar input{padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;background:var(--surface);color:var(--text);}
    table.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
    table.data-table th{text-align:right;color:var(--muted);font-size:11.5px;padding:10px;border-bottom:1.5px solid var(--border);position:sticky;top:0;background:var(--surface);}
    table.data-table td{padding:10px;border-bottom:1px solid var(--border);color:var(--text);}
    .table-scroll{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);}
    .admin-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;}
    @media(max-width:800px){.admin-layout{grid-template-columns:1fr;gap:14px;}}
    .admin-side{border:1px solid var(--border);border-radius:14px;padding:10px;height:fit-content;background:var(--surface);box-shadow:var(--shadow);}
    .admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;margin-bottom:2px;border:1px solid transparent;}
    .admin-side a.active{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-dim);}
    @media(max-width:800px){
      .admin-side{display:flex;overflow-x:auto;gap:6px;padding:8px;-webkit-overflow-scrolling:touch;}
      .admin-side a{flex:0 0 auto;white-space:nowrap;margin-bottom:0;}
    }
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
    .kpi{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface);box-shadow:var(--shadow);}
    .kpi b{font-size:23px;display:block;color:var(--primary-dark);}
    .kpi span{color:var(--muted);font-size:12px;}
    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 0 6px;z-index:50;box-shadow:0 -2px 12px rgba(15,30,28,.06);}
    .bottom-nav-inner{display:flex;justify-content:space-around;}
    .bottom-nav a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;border:none;background:transparent;transition:.15s;}
    .bottom-nav a svg{width:24px;height:24px;outline:none!important;}
    .bottom-nav a.active{color:var(--primary-dark);}
    .bottom-nav a .nav-label{display:none;}
    @media(max-width:760px){
      .bottom-nav{display:block;}
      main{padding-bottom:80px;}
      .nav-links{display:none;}
      .nav-actions{display:none;}
      .topbar-inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;}
      .topbar-inner .mobile-menu-btn{grid-column:1;justify-self:start;}
      .topbar-inner .logo{grid-column:2;justify-self:center;}
      .topbar-inner .mobile-notif-btn{grid-column:3;justify-self:end;}
    }
    .mobile-notif-btn{display:none;}
    .mobile-notif-btn svg{margin:0;}
    .mobile-menu-btn{display:none;background:transparent;border:1.5px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:20px;line-height:1;color:var(--primary-dark);transition:.15s;}
    .mobile-menu{display:none;position:fixed;top:68px;left:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:60;padding:8px;max-height:calc(100vh - 90px);overflow-y:auto;}
    .mobile-menu a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:700;margin-bottom:2px;border:1px solid transparent;}
    .mobile-menu a.active{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-dim);}
    @media(max-width:760px){.mobile-menu-btn{display:inline-flex;}.mobile-notif-btn{display:inline-flex;}}
    @media(max-width:600px){
      main{padding:0 12px 90px;}
      .page-title{font-size:18px;}
      .hero{padding:8px 12px 22px;}
      .card{padding:16px;}
      .filters-bar{flex-direction:column;}
      .filters-bar input,.filters-bar select{width:100%;}
      dl.result-dl{grid-template-columns:1fr;gap:12px;}
      .list-card-grid{grid-template-columns:1fr;}
      .stats-row{grid-template-columns:repeat(2,1fr);}
      .kpi-grid{grid-template-columns:repeat(2,1fr);}
      table.data-table:not(.responsive-stack) th,table.data-table:not(.responsive-stack) td{white-space:normal;word-break:break-word;}
      table.data-table.responsive-stack thead{display:none;}
      table.data-table.responsive-stack,table.data-table.responsive-stack tbody,table.data-table.responsive-stack tr,table.data-table.responsive-stack td{display:block;width:100%;}
      table.data-table.responsive-stack{border-collapse:separate;border-spacing:0;}
      table.data-table.responsive-stack tr{margin-bottom:12px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);box-shadow:var(--shadow);}
      table.data-table.responsive-stack tr:last-child{margin-bottom:0;}
      table.data-table.responsive-stack td{border:none;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-size:13px;}
      table.data-table.responsive-stack td:not(:last-child){border-bottom:1px dashed var(--border);}
      table.data-table.responsive-stack td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:11.5px;flex-shrink:0;}
      table.data-table.responsive-stack td[data-label=""]::before,table.data-table.responsive-stack td:not([data-label])::before{content:none;}
      .rank-hero{flex-wrap:wrap;text-align:center;justify-content:center;}
      table.data-table{font-size:12px;}
      table.data-table th,table.data-table td{padding:8px 6px;}
    }
    @media(max-width:380px){
      .stats-row{grid-template-columns:1fr 1fr;}
      .hero h1{font-size:22px;}
    }
    .toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;}
    .toast{background:var(--text);color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 18px;border-radius:10px;font-size:13px;animation:fadeIn .2s;display:flex;align-items:center;gap:8px;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
    .search-suggest{max-width:600px;margin:14px auto 0;border:1px solid var(--border);border-radius:14px;overflow:hidden;text-align:right;background:var(--surface);box-shadow:var(--shadow);}
    .search-suggest .item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .search-suggest .item:last-child{border-bottom:none;}
    .muted{color:var(--muted);}
    footer.site-footer{border-top:1px solid var(--border);padding:20px 16px;text-align:center;color:var(--muted);font-size:12px;background:var(--surface);}
    a{color:inherit;}
    .telegram-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent-blue);border:1px solid rgba(37,99,235,.3);border-radius:8px;padding:4px 12px 4px 10px;font-size:12.5px;text-decoration:none;transition:.15s;background:rgba(37,99,235,.06);}
    .telegram-link svg{width:16px;height:16px;}
    .chart-container{max-width:320px;margin:0 auto 24px;text-align:center;position:relative;}
    .chart-container canvas{max-width:100%;height:auto;border-radius:50%;cursor:pointer;}
    .chart-tooltip{position:absolute;background:var(--text);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.7;pointer-events:none;z-index:10;white-space:nowrap;box-shadow:var(--shadow);text-align:right;}
    .hosp-row{cursor:pointer;transition:.15s;}
    .hosp-names-inline{padding:14px 16px;display:grid;gap:6px;background:var(--bg-soft,#F8FAFB);border-top:1px solid var(--border);}
    .hosp-name-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);}
    .hosp-name-row:last-child{border-bottom:none;}
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="btn btn-ghost btn-sm mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="القائمة">☰</button>
      <div class="logo" onclick="navigate('home')"><span>تكليفي</span></div>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-actions" id="navActions"></div>
      <button class="btn btn-ghost btn-sm mobile-notif-btn" id="mobileNotifBtn" onclick="navigate('notifications')" aria-label="الإشعارات"></button>
    </div>
  </header>
  <div class="mobile-menu" id="mobileMenu">
    <div id="mobileMenuLinks"></div>
  </div>
  <main id="main"></main>
  <footer class="site-footer">Developed by Ahmed Khaled (Darwish)</footer>
  <nav class="bottom-nav"><div class="bottom-nav-inner" id="bottomNav"></div></nav>
</div>

  // FIX #9: fetchAllRows مع سقف أقصى 5000 صف لتفادي الحلقات اللانهائية
  async function fetchAllRows(table, selectStr, buildQuery, maxRows = 5000){
    const pageSize = 1000;
    let from = 0, all = [];
    while(true){
      let q = sbClient.from(table).select(selectStr);
      if(buildQuery) q = buildQuery(q);
      const { data, error } = await q.range(from, from + pageSize - 1);
      if(error) return { data: null, error };
      all = all.concat(data || []);
      if(!data || data.length < pageSize || all.length >= maxRows) break;
      from += pageSize;
    }
    return { data: all, error: null };
  }

      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  async function doTelegramLogin(){
    const { data: otp, error } = await sbClient.rpc('create_tg_otp');
    if(error || !otp){ toast('خطأ في إنشاء طلب التحقق، حاول مرة أخرى','info'); return; }

  function openTgBot(){

  function cancelTgLogin(){
    clearInterval(tgPollTimer);
    tgOtp = null;
    const statusEl = document.getElementById('tgLoginStatus');
    const btnEl = document.getElementById('tgLoginBtn');
    if(statusEl) statusEl.style.display = 'none';
    if(btnEl) btnEl.disabled = false;
  }

  function startTgPolling(){
    let attempts = 0;
    tgPollTimer = setInterval(async () => {
      attempts++;
      if(attempts > 60){
        clearInterval(tgPollTimer);
        toast('انتهت مدة الانتظار، حاول مرة أخرى','info');
        cancelTgLogin();
        return;
      }

      const { data: res, error: rpcErr } = await sbClient.rpc('claim_tg_login', { p_otp: tgOtp });
      if(rpcErr) return;

      if(res?.status === 'verified'){
        clearInterval(tgPollTimer);
        await completeTgLogin(res.grad_number, res.secret);
      } else if(res?.status === 'not_found' || res?.status === 'expired'){
        clearInterval(tgPollTimer);
        toast('انتهت صلاحية طلب التحقق، حاول مرة أخرى','info');
        cancelTgLogin();
      }
    }, 5000);
  }

  // FIX #14: رسائل debug محذوفة تمامًا من completeTgLogin
  async function completeTgLogin(gradNumber, secret){
    if(!gradNumber || !secret){
      toast('تعذر إكمال الدخول، حاول مرة أخرى','info');
      cancelTgLogin(); return;
    }
    const { data: signInData, error: signInErr } = await sbClient.auth.signInWithPassword({
      email: gradEmail(gradNumber), password: secret
    });
    const signedIn = (!signInErr && signInData?.user) ? signInData.user : null;

    if(!signedIn){
      toast('تم التحقق من تليجرام لكن فشل الدخول، تواصل مع الإدارة','info');
      cancelTgLogin(); return;
    }

    const { data: profile, error: pErr } = await sbClient
      .from('profiles').select('id, grad_number, name, status')
      .eq('id', signedIn.id).maybeSingle();

    if(pErr || !profile){
      toast('حدث خطأ في تحميل بيانات حسابك، تواصل مع الإدارة','info');
      await sbClient.auth.signOut();
      cancelTgLogin(); return;
    }
    if(profile.status === 'pending'){
      await sbClient.auth.signOut();
      toast('حسابك قيد المراجعة، بانتظار موافقة الإدارة','clock');
      cancelTgLogin(); return;
    }
    if(profile.status === 'suspended'){
      await sbClient.auth.signOut();
      toast('حسابك موقوف، تواصل مع الإدارة','info');
      cancelTgLogin(); return;
    }

    tgOtp = null;
    cancelTgLogin();
    toast(`أهلاً ${profile.name}! تم تسجيل الدخول بنجاح`,'check');
    navigate('home');
  }

  async function doRegister(){
    const name = document.getElementById('regName').value.trim();
    const gradNumber = document.getElementById('regGradNum').value.trim();
    const phone = document.getElementById('regPhone').value.trim().replace(/\s/g,'');
    const telegram = sanitizeTelegram(document.getElementById('regTelegram')?.value || '');
    if(!name || !gradNumber || !phone){ toast('يرجى تعبئة جميع الحقول المطلوبة','info'); return; }
    if(!phone.match(/^0[0-9]{9,10}$/)){ toast('يرجى إدخال رقم هاتف مصري صحيح','info'); return; }

    // FIX #3: select الحقول المطلوبة فقط
    const { data: student, error: sErr } = await sbClient
      .from('students').select('grad_number,name').eq('grad_number', gradNumber).single();
    if(sErr || !student){ toast('الرقم القومي غير موجود في قاعدة بيانات التنسيق','info'); return; }
    if(normalizeArabic(student.name) !== normalizeArabic(name)){
      toast('الاسم المدخل لا يطابق الاسم المسجل في النتيجة','info'); return;
    }

    const { data: existing } = await sbClient.from('profiles').select('id').eq('grad_number', gradNumber).maybeSingle();
    if(existing){ toast('يوجد حساب مسجل بالفعل بهذا الرقم','info'); return; }

    const tempPass = Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b=>b.toString(16).padStart(2,'0')).join('');
    const email = gradEmail(gradNumber);
    const { data: auth, error: signUpErr } = await sbClient.auth.signUp({ email, password: tempPass });
    if(signUpErr){ toast('فشل إنشاء الحساب: '+signUpErr.message,'info'); return; }

    const profileData = {
      id: auth.user.id, name, grad_number: gradNumber, phone, telegram,
      status: 'pending', role: 'user', created_at: new Date().toISOString()
    };

    const { data: newProfile, error: profErr } = await sbClient
      .from('profiles').insert([profileData]).select().single();

    if(profErr){ toast('فشل إنشاء الملف الشخصي: '+profErr.message,'info'); return; }

    currentUser = auth.user;
    currentProfile = newProfile;

    await sbClient.from('students').update({ user_id: auth.user.id })
      .eq('grad_number', gradNumber).is('user_id', null);
    await sbClient.from('account_requests').insert({ name, grad_number: gradNumber, phone, telegram });

    toast('تم إرسال طلب إنشاء الحساب، بانتظار مراجعة الإدارة','clock');
  }

      .ilike('hospital', `%${q}%`)
      .limit(200);

        </div>

      <div class="list-card">
        <div class="list-card-top">

        </div>

  async function sendBulkSwapRequests(){
    if(!currentUser || currentProfile?.status!=='approved'){ toast('يرجى تسجيل الدخول أولاً','info'); navigate('auth'); return; }
    if(!lastSearchResults.length){ toast('لا يوجد نتائج بحث حاليًا','info'); return; }
    if(!confirm(`هل تريد إرسال طلب تبديل لكل الـ ${lastSearchResults.length} طالب في هذه الجهة؟`)) return;

    const { data: applicant, error: aErr } = await sbClient
      .from('students')
      .select('hospital')
      .eq('grad_number', currentProfile.grad_number)
      .single();
    if(aErr){ toast('لم يتم العثور على بياناتك','info'); return; }

    const gradNumbers = lastSearchResults.map(s=>s.grad_number);
    const { data: targets } = await sbClient
      .from('students')
      .select('id, grad_number, hospital, user_id')
      .in('grad_number', gradNumbers);

    const targetStudentIds = (targets||[]).map(t=>t.id);
    const { data: existing } = await sbClient
      .from('swap_requests')
      .select('target_student_id')
      .eq('applicant_id', currentProfile.id)
      .in('target_student_id', targetStudentIds)
      .in('status', ['pending','sent']);
    const alreadyRequested = new Set((existing||[]).map(e=>e.target_student_id));

    const toSend = (targets||[]).filter(t=> !alreadyRequested.has(t.id));
    if(!toSend.length){ toast('لقد أرسلت طلبات لكل هؤلاء بالفعل','info'); return; }

    const rows = toSend.map(t=>({
      applicant_id: currentProfile.id,
      target_student_id: t.id,
      current_hospital: applicant.hospital,
      target_hospital: t.hospital,
      status: 'sent',
      telegram: currentProfile.telegram || ''
    }));

    const { data: inserted, error: insErr } = await sbClient
      .from('swap_requests').insert(rows).select('id, target_student_id');
    if(insErr){ toast('فشل إرسال الطلبات: '+insErr.message,'info'); return; }

    const notifRows = (inserted||[])
      .map(r=>{
        const t = toSend.find(x=>x.id===r.target_student_id);
        return t?.user_id ? {
          user_id: t.user_id,
          text: `طلب تبديل ورد من ${currentProfile.name}`,
          type: 'swap',
          request_id: r.id,
          status: 'pending',
          read: false
        } : null;
      }).filter(Boolean);

    if(notifRows.length){
      await sbClient.from('notifications').insert(notifRows);
    }

    toast(`تم إرسال طلب تبديل لـ ${toSend.length} شخص${alreadyRequested.size ? ` (تخطينا ${alreadyRequested.size} مُرسَل لهم مسبقًا)` : ''}`,'check');
    navigate('myRequests');
  }

  async function sendSwapRequest(targetGradNumber){
    if(!currentUser || currentProfile?.status!=='approved'){ toast('يرجى تسجيل الدخول أولاً','info'); navigate('auth'); return; }
    if(targetGradNumber === currentProfile.grad_number){ toast('لا يمكنك إرسال طلب تبديل لنفسك','info'); return; }

    const { data: target, error: tErr } = await sbClient
      .from('students')
      .select('id, name, hospital, user_id')
      .eq('grad_number', targetGradNumber)
      .single();
    if(tErr){ toast('لم يتم العثور على المرشح','info'); return; }

    const { data: applicant, error: aErr } = await sbClient
      .from('students')
      .select('id, hospital')
      .eq('grad_number', currentProfile.grad_number)
      .single();
    if(aErr){ toast('لم يتم العثور على بياناتك','info'); return; }

    const { data: dup } = await sbClient
      .from('swap_requests')
      .select('id')
      .eq('applicant_id', currentProfile.id)
      .eq('target_student_id', target.id)
      .in('status', ['pending','sent'])
      .maybeSingle();
    if(dup){ toast(`لقد أرسلت طلبًا لـ ${target.name} بالفعل، وهو لسه مستني الرد`,'info'); navigate('myRequests'); return; }

    const { data: newReq, error: insErr } = await sbClient
      .from('swap_requests')
      .insert({
        applicant_id: currentProfile.id,
        target_student_id: target.id,
        current_hospital: applicant.hospital,
        target_hospital: target.hospital,
        status: 'sent',
        telegram: currentProfile.telegram || ''
      })
      .select().single();
    if(insErr){ toast('فشل إرسال الطلب: '+insErr.message,'info'); return; }
    const requestId = newReq?.id;

    if(target.user_id){
      await sbClient.from('notifications').insert({
        user_id: target.user_id,
        text: `طلب تبديل ورد من ${currentProfile.name}`,
        type: 'swap',
        request_id: requestId,
        status: 'pending',
        read: false
      });
      toast(`تم إرسال طلب تبديل إلى ${target.name}`,'check');
    } else {
      toast(`تم إرسال طلب تبديل — ${target.name} لسه معندوش حساب، وهيشوف طلبك في "طلباتي" أول ما يسجّل`,'check');
    }
    navigate('myRequests');
  }

      ? query.or(`applicant_id.eq.${currentProfile.id},target_student_id.eq.${myStudent.id}`)

    const { data, error } = await query;

      (profs||[]).forEach(p=> profilesMap[p.id]=p);

    ${data.map(r=>{
      const isApplicant = r.applicant_id === currentProfile?.id;
      const approved = r.status==='approved_by_both' || r.status==='approved_by_admin';
      const otherId = isApplicant ? r.target_student?.user_id : r.applicant_id;
      const otherProfile = otherId ? profilesMap[otherId] : null;

        actions = `
          <button class="btn btn-primary btn-sm" data-id="${escAttr(r.id)}" onclick="respondSwapBtn(this,true)">${ICONS.check}قبول</button>

      const cardMeta = otherProfile ? {

        telegram: otherProfile.telegram, hospital: otherHospital
      } : null;
      return `
      <div class="list-card">
        <div class="list-card-top">
          <div>

  async function respondToSwapRequest(requestId, accept){
    const newStatus = accept ? 'approved_by_both' : 'rejected';
    const { data: req, error: getErr } = await sbClient
      .from('swap_requests')
      .select(`
        status, applicant_id, current_hospital, target_hospital,
        applicant:profiles!applicant_id(name, grad_number, telegram),
        target_student:students(user_id)
      `)
      .eq('id', requestId)
      .single();
    if(getErr){ toast('لم يتم العثور على الطلب','info'); return; }
    if(req.status !== 'sent'){ toast('هذا الطلب لم يعد قائمًا (تم إلغاؤه أو الرد عليه بالفعل)','info'); navigate('myRequests'); return; }

    await sbClient.from('swap_requests').update({ status: newStatus }).eq('id', requestId);

    const myMeta = accept ? {
      name: currentProfile.name, grad_number: currentProfile.grad_number,
      telegram: currentProfile.telegram || '', hospital: req.target_hospital || ''
    } : null;

    if(req.applicant_id){
      await sbClient.from('notifications').insert({
        user_id: req.applicant_id,
        text: accept ? `تمت الموافقة على طلب التبديل من ${currentProfile.name}` : `تم رفض طلب التبديل من ${currentProfile.name}`,
        type: accept ? 'approval' : 'rejection',
        request_id: requestId,
        status: accept ? 'accepted' : 'rejected',
        meta: myMeta,
        read: false
      });
    }
    toast(accept ? 'تم قبول الطلب — بيانات التواصل ظاهرة تحت' : 'تم رفض الطلب','check');
    navigate('myRequests');
  }

    const univs = (rows||[]).map(r=>({

    }));

    setTimeout(()=>drawUniversityChart(univs),0);
    return `
    <div class="page-title">تحليل الجامعات</div>
    <div class="page-sub">مرتبة تنازليًا حسب عدد الطلاب</div>

      <canvas id="univChart" width="200" height="200"></canvas>
      <div id="univTooltip" class="chart-tooltip" style="display:none;"></div>
    </div>
    <div class="table-scroll">
    <table class="data-table" style="text-align:center;">
      <thead><tr><th style="text-align:center;">الجامعة</th><th style="text-align:center;">عدد المكلفين</th></tr></thead>
      <tbody>
      ${univs.map(u=>`<tr><td><b>${esc(u.u)}</b></td><td>${ar(u.t)}</td></tr>`).join('')}
      </tbody>

  function drawUniversityChart(univs){
    const canvas = document.getElementById('univChart');
    const tooltip = document.getElementById('univTooltip');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const total = univs.reduce((s,d)=>s+d.t,0);
    if(total===0) return;
    const colors = ['#0D9488','#D97706','#2563EB','#7C3AED','#DC2626','#16A34A','#CA8A04','#EA580C','#0891B2','#4F46E5','#DB2777','#65A30D'];
    const cx=100, cy=100, r=85, rInner=45;
    let start = -Math.PI/2;
    const slices = univs.map((u,i)=>{
      const angle = (u.t/total)*2*Math.PI;
      const slice = { label:u.u, value:u.t, pct:((u.t/total)*100).toFixed(1), start, end:start+angle, color: colors[i%colors.length] };
      start += angle;
      return slice;
    });

    function draw(hoverIdx){
      ctx.clearRect(0,0,200,200);
      slices.forEach((s,i)=>{
        const isHover = i===hoverIdx;
        const mid = (s.start+s.end)/2;
        const off = isHover ? 4 : 0;
        const ox = Math.cos(mid)*off, oy = Math.sin(mid)*off;
        ctx.beginPath();
        ctx.moveTo(cx+ox, cy+oy);
        ctx.arc(cx+ox, cy+oy, r, s.start, s.end);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.globalAlpha = (hoverIdx==null || isHover) ? 1 : 0.5;
        ctx.fill();
        ctx.globalAlpha = 1;
      });
      ctx.beginPath();
      ctx.arc(cx,cy,rInner,0,2*Math.PI);
      ctx.fillStyle='#FFFFFF';
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.fillStyle='#0F766E';
      ctx.font='bold 14px Cairo';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(ar(total),cx,cy-6);
      ctx.fillStyle='#5B6E6A';
      ctx.font='10px Cairo';
      ctx.fillText('طلاب',cx,cy+12);
    }
    draw(null);

    function hitTest(mx,my){
      const dx = mx-cx, dy = my-cy;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist>r || dist<rInner) return -1;
      let ang = Math.atan2(dy,dx);
      if(ang < -Math.PI/2) ang += 2*Math.PI;
      for(let i=0;i<slices.length;i++){
        if(ang>=slices[i].start && ang<slices[i].end) return i;
      }
      return -1;
    }

    canvas.onmousemove = function(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
      const mx = (e.clientX-rect.left)*scaleX;
      const my = (e.clientY-rect.top)*scaleY;
      const idx = hitTest(mx,my);
      if(idx>=0){
        draw(idx);
        const s = slices[idx];
        tooltip.style.display='block';
        tooltip.innerHTML = `<b>${esc(s.label)}</b><br>${ar(s.value)} طالب — ${s.pct}%`;
        tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
        tooltip.style.top = (e.clientY - rect.top + 12) + 'px';
      } else {
        draw(null);
        tooltip.style.display='none';
      }
    };
    canvas.onmouseleave = function(){
      draw(null);
      tooltip.style.display='none';
    };
  }

  async function adminAction(id, status){
    const { data: req } = await sbClient
      .from('swap_requests')
      .select('applicant_id, current_hospital, target_hospital')
      .eq('id', id).single();

    await sbClient.from('swap_requests').update({ status }).eq('id', id);

    if(req?.applicant_id){
      await sbClient.from('notifications').insert({
        user_id: req.applicant_id,
        text: status==='approved_by_admin'
          ? `اعتمدت الإدارة طلب التبديل الخاص بك (من ${req.current_hospital} إلى ${req.target_hospital})`
          : `تم رفض طلب التبديل الخاص بك من قِبل الإدارة`,

  async function adminAccountAction(id, status){
    await sbClient.from('account_requests').update({ status }).eq('id', id);
    if(status === 'approved'){
      const { data: req } = await sbClient
        .from('account_requests')
        .select('grad_number, phone, telegram, name')
        .eq('id', id).single();
      if(req){
        const { data: profile } = await sbClient
          .from('profiles').select('id').eq('grad_number', req.grad_number).single();
        if(profile){
          await sbClient.from('profiles').update({ status: 'approved', role: 'user' }).eq('id', profile.id);
          await sbClient.from('students').update({ user_id: profile.id }).eq('grad_number', req.grad_number);
        }
      }
    }
    toast(status==='approved' ? 'تم اعتماد الحساب' : 'تم رفض الحساب','check');
    navigate('admin', { sub: 'accounts' });
  }

  async function adminDeleteAccount(profileId, gradNumber, name){
    if(!confirm(`هل أنت متأكد من حذف حساب "${name}" نهائيًا؟ هذا الإجراء لا يمكن التراجع عنه.`)) return;

    await sbClient.from('notifications').delete().eq('user_id', profileId);
    const { data: sRow } = await sbClient.from('students').select('id').eq('grad_number', gradNumber).maybeSingle();
    const orParts = [`applicant_id.eq.${profileId}`];
    if(sRow?.id) orParts.push(`target_student_id.eq.${sRow.id}`);
    await sbClient.from('swap_requests').delete().or(orParts.join(','));
    await sbClient.from('account_requests').delete().eq('grad_number', gradNumber);
    await sbClient.from('students').update({ user_id: null }).eq('grad_number', gradNumber);

    const { error } = await sbClient.from('profiles').delete().eq('id', profileId);
    if(error){ toast('فشل حذف الحساب: '+error.message,'info'); return; }
    toast('تم حذف الحساب نهائيًا','check');
    navigate('admin', { sub: 'accounts' });
  }

  async function adminSaveAnnouncement(id){
    const text = (document.getElementById('annText')?.value || '').trim();
    const buttonLabel = (document.getElementById('annBtnLabel')?.value || '').trim();
    const buttonUrl = (document.getElementById('annBtnUrl')?.value || '').trim();
    if(!text){ toast('اكتب نص الإعلان الأول','info'); return; }
    if((buttonLabel && !buttonUrl) || (!buttonLabel && buttonUrl)){
      toast('لازم تدخل اسم الزرار ورابطه مع بعض، أو تسيبهم فاضيين','info'); return;
    }
    if(buttonUrl && !/^https?:\/\//i.test(buttonUrl)){
      toast('رابط الزرار لازم يبدأ بـ http:// أو https://','info'); return;
    }

    const payload = {
      text, button_label: buttonLabel || null,
      button_url: buttonUrl || null, updated_at: new Date().toISOString()
    };

    let error;
    if(id){
      ({ error } = await sbClient.from('announcements').update(payload).eq('id', id));
    } else {
      ({ error } = await sbClient.from('announcements').insert({ ...payload, created_by: currentProfile.id }));
    }
    if(error){ toast('فشل حفظ الإعلان: '+error.message,'info'); return; }

    editingAnnouncementId = null;
    toast(id ? 'تم تعديل الإعلان' : 'تم نشر الإعلان لكل المستخدمين','check');
    navigate('admin', { sub: 'broadcast' });
  }

  async function adminDeleteAnnouncement(id){
    if(!confirm('هل تريد حذف هذا الإعلان؟')) return;
    const { error } = await sbClient.from('announcements').delete().eq('id', id);
    if(error){ toast('فشل حذف الإعلان: '+error.message,'info'); return; }
    toast('تم حذف الإعلان','check');
    navigate('admin', { sub: 'broadcast' });
  }

  async function render(){
    await renderHeader();
    const main = document.getElementById('main');
    let html = '';
    try {
      switch(route.name){
        case 'home': html = await pageHome(); break;
        case 'searchResults': html = await pageSearchResults(route.params.q); break;
        case 'result': html = await pageResult(route.params.id); break;
        case 'auth': html = await pageAuth(); break;
        case 'requestSwap': html = await pageRequestSwap(route.params.id); break;
        case 'candidates': html = pageCandidates(route.params); break;
        case 'myRequests': html = await pageMyRequests(); break;
        case 'notifications': html = await pageNotifications(); break;
        case 'universities': html = await pageUniversities(); break;
        case 'hospitals': html = await pageHospitals(); break;
        case 'admin': html = await pageAdmin(route.params.sub); break;
        default: html = await pageHome();
      }
    } catch(e) {
      html = `<div class="empty-state">حدث خطأ، يرجى تحديث الصفحة</div>`;
    }
    main.innerHTML = html;
    main.classList.toggle('with-padding', route.name !== 'home');
    main.classList.remove('page-fade');
    void main.offsetWidth;
    main.classList.add('page-fade');
    window.scrollTo(0,0);
  }

  (async function init(){
    try {
      const { data: { session } } = await sbClient.auth.getSession();
      if(session?.user){
        currentUser = session.user;
        _lastAuthUserId = currentUser.id;
        const { data: profile } = await sbClient
          .from('profiles').select('*').eq('id', currentUser.id).single();
        currentProfile = profile || null;
      }
    } catch(e) { /* تجاهل أخطاء التحميل الأولي */ }
    render();
  })();
